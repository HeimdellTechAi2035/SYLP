name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sylp_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sylp_staff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylp_test -d sylp_staff_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sylp_test:isolated_ci_only@localhost:5432/sylp_staff_test
      SESSION_SECRET: isolated-ci-build-session-secret-never-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Mirror production's NODE_ENV to catch missing build-time packages.
      - run: NODE_ENV=production npm ci --include=dev
      - run: node -e "require.resolve('@tailwindcss/postcss')"
      - run: npx prisma generate --no-hints
      # A successful generate is not sufficient if @prisma/client still
      # points at a missing .prisma/client/default module (production 500).
      - run: node -e "require('@prisma/client')"
      - run: bash -n deploy/deploy-sylp.sh
      - run: npm run check:css
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:launch
      - run: npx prisma migrate deploy
      - run: node scripts/check-staff-database.mjs
      - run: npm run build
# The legacy integration/E2E harness targets SQLite and requires conversion
# to an isolated Postgres service before it can run against this schema.
